<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Timer App</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .timer-card { background-color: #2c2c2e; border-radius: 15px; padding: 30px; max-width: 400px; margin: 0 auto 20px; }
        #time { font-size: 4.5rem; font-weight: 200; }
        #percentage { font-size: 1.2rem; color: #aaa; margin-top: 5px; }
        .status { color: #8e8e93; font-size: 1.2rem; margin-top: 10px; }
        
        .progress-section { margin: 20px 0; }
        .progress-labels { display: flex; justify-content: space-between; font-size: 0.8rem; color: #8e8e93; }
        .progress-bar { background-color: #48484a; height: 4px; border-radius: 2px; margin: 5px 0; }
        .progress-fill { background-color: white; height: 100%; width: 0%; }
        
        .controls button { background: #333; color: white; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 1.5rem; margin: 0 10px; cursor: pointer; }
        .controls button.play { background: #007aff; }
        
        .adjust { margin: 20px 0; }
        .adjust button { background: #333; color: white; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 0.9rem; margin: 5px; cursor: pointer; }
        
        .speed-controls { margin: 20px 0; }
        .speed-controls button { background: #333; color: white; border: none; padding: 10px 15px; margin: 0 5px; border-radius: 15px; cursor: pointer; }
        .speed-controls button.active { background: #007aff; }
        
        .stats { background: #2c2c2e; padding: 15px; border-radius: 10px; max-width: 400px; margin: 0 auto; text-align: left; }
    </style>
</head>
<body>

    <div class="timer-card">
        <div id="time">05:00</div>
        <div id="percentage">100% left</div>
        <div class="status" id="status">paused</div>
    </div>

    <div class="progress-section" style="max-width: 400px; margin: 0 auto 20px;">
        <div class="progress-labels">
            <span>ELAPSED: <span id="elapsed">0:00</span></span>
            <span>TOTAL: <span id="total">5:00</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    </div>

    <div class="controls">
        <button onclick="resetTimer()">✕</button>
        <button class="play" onclick="startTimer()">▶</button>
        <button onclick="pauseTimer()">⏸</button>
    </div>

    <div class="adjust">
        <div>
            <button onclick="addTime(-300)">-5m</button>
            <button onclick="addTime(-600)">-10m</button>
            <button onclick="addTime(-900)">-15m</button>
            <button onclick="addTime(-1800)">-30m</button>
            <button onclick="addTime(-3600)">-60m</button>
        </div>
        <div>
            <button onclick="addTime(300)">+5m</button>
            <button onclick="addTime(600)">+10m</button>
            <button onclick="addTime(900)">+15m</button>
            <button onclick="addTime(1800)">+30m</button>
            <button onclick="addTime(3600)">+60m</button>
        </div>
    </div>

    <div class="speed-controls">
        <button onclick="setSpeed(0.5, this)">0.5x</button>
        <button class="active" onclick="setSpeed(1, this)">1x</button>
        <button onclick="setSpeed(2, this)">2x</button>
        <button onclick="setSpeed(5, this)">5x</button>
        <button onclick="setSpeed(10, this)">10x</button>
    </div>

    <div class="stats">
        <h3>📊 Stats</h3>
        <p>Sessions Completed: <span id="sessions">0</span></p>
        <p>Total Time Elapsed: <span id="totalElapsed">0</span> minutes</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
