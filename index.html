<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Style Timer</title>
    <style>
        body { background-color: #000000; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .timer-container { position: relative; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .timer-ring { transform: rotate(-90deg); position: absolute; }
        .ring-bg { fill: none; stroke: #1c1c1e; stroke-width: 8; }
        .ring-fill { fill: none; stroke: #ff9500; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 880; stroke-dashoffset: 0; }
        .time-display { text-align: center; z-index: 1; }
        #time { font-size: 4.5rem; font-weight: 200; }
        #percentage { font-size: 1rem; color: #8e8e93; margin-top: 5px; }
        .controls { display: flex; justify-content: space-between; width: 300px; margin-bottom: 30px; }
        .btn { width: 80px; height: 80px; border-radius: 50%; border: none; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .btn-cancel { background-color: #1c1c1e; color: #8e8e93; }
        .btn-start { background-color: #142715; color: #2fd158; }
        .btn-pause { background-color: #331611; color: #ff9f0a; }
        .adjust, .speed-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 350px; margin-bottom: 20px; }
        .adjust button, .speed-controls button { background-color: #2c2c2e; color: white; border: none; border-radius: 20px; padding: 12px 20px; font-size: 1rem; }
        .speed-controls button.active { background-color: #ff9500; color: black; font-weight: bold; }
        .stats { background-color: #1c1c1e; padding: 15px; border-radius: 10px; width: 300px; text-align: left; color: #8e8e93; }
    </style>
</head>
<body>
    <div class="timer-container">
        <svg class="timer-ring" width="300" height="300">
            <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
            <circle class="ring-fill" cx="150" cy="150" r="140" id="ring"></circle>
        </svg>
        <div class="time-display">
            <div id="time">05:00</div>
            <div id="percentage">100% left</div>
        </div>
    </div>
    <div class="controls">
        <button class="btn btn-cancel" onclick="resetTimer()">Cancel</button>
        <button class="btn btn-start" id="actionBtn" onclick="toggleTimer()">Start</button>
    </div>
    <div class="adjust">
        <button onclick="addTime(-300)">-5m</button>
        <button onclick="addTime(-900)">-15m</button>
        <button onclick="addTime(-3600)">-60m</button>
        <button onclick="addTime(300)">+5m</button>
        <button onclick="addTime(900)">+15m</button>
        <button onclick="addTime(3600)">+60m</button>
    </div>
    <div class="speed-controls">
        <button onclick="setSpeed(0.5, this)">0.5x</button>
        <button class="active" onclick="setSpeed(1, this)">1x</button>
        <button onclick="setSpeed(2, this)">2x</button>
        <button onclick="setSpeed(5, this)">5x</button>
        <button onclick="setSpeed(10, this)">10x</button>
        <button onclick="setSpeed(20, this)">20x</button>
    </div>
    <div class="stats">
        <p>Sessions: <span id="sessions">0</span></p>
        <p>Total Elapsed: <span id="totalElapsed">0</span> min</p>
        <p>5-Sec Intervals: <span id="fiveSecondCount">0</span></p>
    </div>
    <script>
        let totalTime = parseInt(localStorage.getItem('totalTime')) || 300;
        let timeLeft = parseInt(localStorage.getItem('timeLeft')) || 300;
        let timerId = null;
        let totalElapsedSeconds = parseInt(localStorage.getItem('totalElapsedSeconds')) || 0;
        let speedMultiplier = 1;
        let lastTick = parseInt(localStorage.getItem('lastTick')) || Date.now();
        const circumference = 2 * Math.PI * 140;
        document.getElementById('ring').style.strokeDasharray = circumference;
        function format(s) { return Math.floor(s/60) + ":" + (s%60).toString().padStart(2,'0'); }
        function update() {
            document.getElementById('time').innerText = format(timeLeft);
            const percent = Math.max(0, Math.round((timeLeft / totalTime) * 100));
            document.getElementById('percentage').innerText = `${percent}% left`;
            const offset = circumference - (timeLeft / totalTime) * circumference;
            document.getElementById('ring').style.strokeDashoffset = offset;
            document.getElementById('totalElapsed').innerText = Math.floor(totalElapsedSeconds / 60);
            document.getElementById('fiveSecondCount').innerText = Math.floor(totalElapsedSeconds / 5);
            localStorage.setItem('totalTime', totalTime);
            localStorage.setItem('timeLeft', timeLeft);
        }
        function toggleTimer() { if (timerId) pauseTimer(); else startTimer(); }
        function startTimer() {
            if(timerId) return;
            document.getElementById('actionBtn').innerText = 'Pause';
            document.getElementById('actionBtn').className = 'btn btn-pause';
            lastTick = Date.now();
            timerId = setInterval(() => {
                const now = Date.now();
                const elapsed = Math.floor((now - lastTick) / 1000);
                if (elapsed >= 1) {
                    const deduct = elapsed * speedMultiplier;
                    if (timeLeft > 0) {
                        timeLeft = Math.max(0, timeLeft - deduct);
                        totalElapsedSeconds += deduct;
                        localStorage.setItem('totalElapsedSeconds', totalElapsedSeconds);
                        lastTick = now;
                        update();
                    } else { pauseTimer(); }
                }
            }, 100);
        }
        function pauseTimer() { clearInterval(timerId); timerId = null; document.getElementById('actionBtn').innerText = 'Start'; document.getElementById('actionBtn').className = 'btn btn-start'; }
        function resetTimer() { pauseTimer(); timeLeft = totalTime; update(); }
        function addTime(s) { totalTime = Math.max(60, totalTime + s); timeLeft = Math.max(0, timeLeft + s); update(); }
        function setSpeed(s, el) { speedMultiplier = s; document.querySelectorAll('.speed-controls button').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
        update();
    </script>
</body>
</html>
