<div class="timer-container">
    <svg class="timer-ring" width="300" height="300">
        <circle class="ring-bg" cx="150" cy="150" r="140"></circle>
        <circle class="ring-fill" cx="150" cy="150" r="140" id="ring"></circle>
    </svg>
    <div class="time-display">
        <div id="time">05:00</div>
        <div id="percentage">100% left</div>
    </div>
</div>

<div class="controls">
    <button class="btn btn-cancel" onclick="resetTimer()">Cancel</button>
    <button class="btn btn-start" id="actionBtn" onclick="toggleTimer()">Start</button>
</div>

<div class="adjust">
    <button onclick="addTime(-300)">-5m</button>
    <button onclick="addTime(-900)">-15m</button>
    <button onclick="addTime(-3600)">-60m</button>
    <button onclick="addTime(300)">+5m</button>
    <button onclick="addTime(900)">+15m</button>
    <button onclick="addTime(3600)">+60m</button>
</div>

<div class="speed-controls">
    <button onclick="setSpeed(0.5, this)">0.5x</button>
    <button class="active" onclick="setSpeed(1, this)">1x</button>
    <button onclick="setSpeed(2, this)">2x</button>
    <button onclick="setSpeed(5, this)">5x</button>
    <button onclick="setSpeed(10, this)">10x</button>
    <button onclick="setSpeed(20, this)">20x</button>
</div>

<div class="stats">
    <p>Sessions: <span id="sessions">0</span></p>
    <p>Total Elapsed: <span id="totalElapsed">0</span> min</p>
    <p>5-Sec Intervals: <span id="fiveSecondCount">0</span></p>
</div>

<script>
    let totalTime = parseInt(localStorage.getItem('totalTime')) || 300;
    let timeLeft = parseInt(localStorage.getItem('timeLeft')) || 300;
    let timerId = null;
    let totalElapsedSeconds = parseInt(localStorage.getItem('totalElapsedSeconds')) || 0;
    let speedMultiplier = 1;
    let lastTick = parseInt(localStorage.getItem('lastTick')) || Date.now();
    const circumference = 2 * Math.PI * 140;

    document.getElementById('ring').style.strokeDasharray = circumference;

    function format(s) { return Math.floor(s/60) + ":" + (s%60).toString().padStart(2,'0'); }

    function update() {
        document.getElementById('time').innerText = format(timeLeft);
        const percent = Math.max(0, Math.round((timeLeft / totalTime) * 100));
        document.getElementById('percentage').innerText = `${percent}% left`;
        
        const offset = circumference - (timeLeft / totalTime) * circumference;
        document.getElementById('ring').style.strokeDashoffset = offset;
        
        document.getElementById('totalElapsed').innerText = Math.floor(totalElapsedSeconds / 60);
        document.getElementById('fiveSecondCount').innerText = Math.floor(totalElapsedSeconds / 5);
        
        localStorage.setItem('totalTime', totalTime);
        localStorage.setItem('timeLeft', timeLeft);
    }

    function toggleTimer() {
        if (timerId) pauseTimer();
        else startTimer();
    }

    function startTimer() {
        if(timerId) return;
        document.getElementById('actionBtn').innerText = 'Pause';
        document.getElementById('actionBtn').className = 'btn btn-pause';
        lastTick = Date.now();
        
        timerId = setInterval(() => {
            const now = Date.now();
            const elapsed = Math.floor((now - lastTick) / 1000);
            if (elapsed >= 1) {
                const deduct = elapsed * speedMultiplier;
                if (timeLeft > 0) {
                    timeLeft = Math.max(0, timeLeft - deduct);
                    totalElapsedSeconds += deduct;
                    localStorage.setItem('totalElapsedSeconds', totalElapsedSeconds);
                    lastTick = now;
                    update();
                } else {
                    pauseTimer();
                }
            }
        }, 100);
    }

    function pauseTimer() { 
        clearInterval(timerId); timerId = null; 
        document.getElementById('actionBtn').innerText = 'Start';
        document.getElementById('actionBtn').className = 'btn btn-start';
    }

    function resetTimer() { pauseTimer(); timeLeft = totalTime; update(); }

    function addTime(s) { 
        totalTime = Math.max(60, totalTime + s); 
        timeLeft = Math.max(0, timeLeft + s); 
        update(); 
    }

    function setSpeed(s, el) {
        speedMultiplier = s;
        document.querySelectorAll('.speed-controls button').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    update();
</script>
